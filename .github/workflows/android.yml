name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'i18n/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'i18n/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build APK
        working-directory: android
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/BMCU-Flasher-NoNo-android.apk
          cd dist
          sha256sum BMCU-Flasher-NoNo-android.apk > BMCU-Flasher-NoNo-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BMCU-Flasher-NoNo-android
          path: dist/*
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
